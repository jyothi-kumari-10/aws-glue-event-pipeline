AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Event-driven Glue data pipeline (S3 -> Lambda -> Glue Workflow -> S3),
  as a single CloudFormation stack. Equivalent to what scripts/deploy.sh
  builds imperatively via AWS CLI, expressed here declaratively instead.

Parameters:
  InputBucketName:
    Type: String
    Default: adej-pipeline-input
    Description: Bucket CSVs are uploaded to (must be globally unique).
  OutputBucketName:
    Type: String
    Default: adej-pipeline-output
    Description: Bucket transformed CSVs are written to.
  ScriptsBucketName:
    Type: String
    Default: adej-pipeline-scripts
    Description: Bucket holding the Glue job's Python script.
  GlueDatabaseName:
    Type: String
    Default: adej_pipeline_db

Resources:

  # ---------- IAM Roles ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: glue-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # ---------- S3 Buckets ----------
  ScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ScriptsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # InputBucket is created LAST among the buckets, and depends on the Lambda
  # permission below. This breaks what would otherwise be a circular
  # dependency: the bucket's own NotificationConfiguration needs the Lambda's
  # ARN, and S3 requires the invoke permission to exist before it will accept
  # a Lambda notification config on the bucket.
  InputBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Ref InputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt TriggerLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "input/"
                  - Name: suffix
                    Value: ".csv"

  # ---------- Glue Data Catalog ----------
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName

  # ---------- Glue Crawlers ----------
  InputCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: input-crawler
      Role: !Ref GlueRole
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${InputBucketName}/input/"
    DependsOn:
      - GlueDatabase
      - InputBucket

  OutputCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: output-crawler
      Role: !Ref GlueRole
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${OutputBucketName}/output/"
    DependsOn:
      - GlueDatabase
      - OutputBucket

  # ---------- Glue Job ----------
  TransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: product-transform-job
      Role: !Ref GlueRole
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptsBucketName}/scripts/glue_job.py"
      DefaultArguments:
        "--library-set": "analytics"
      MaxCapacity: 0.0625
      Timeout: 10
    DependsOn: ScriptsBucket

  # ---------- Glue Workflow + Triggers ----------
  PipelineWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: pipeline-workflow

  StartTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: start-trigger
      WorkflowName: !Ref PipelineWorkflow
      Type: ON_DEMAND
      Actions:
        - CrawlerName: !Ref InputCrawler

  AfterInputCrawlerTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: after-input-crawler
      WorkflowName: !Ref PipelineWorkflow
      Type: CONDITIONAL
      StartOnCreation: true
      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref InputCrawler
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref TransformJob

  AfterJobTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: after-job
      WorkflowName: !Ref PipelineWorkflow
      Type: CONDITIONAL
      StartOnCreation: true
      Predicate:
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref TransformJob
            State: SUCCEEDED
      Actions:
        - CrawlerName: !Ref OutputCrawler

  # ---------- Lambda ----------
  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: trigger-glue-workflow
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3

          WORKFLOW_NAME = "pipeline-workflow"

          glue = boto3.client("glue")


          def lambda_handler(event, context):
              records = event.get("Records", [])
              if not records:
                  print("No S3 records in event, starting workflow with no run properties")
                  response = glue.start_workflow_run(Name=WORKFLOW_NAME)
                  print(f"Started workflow '{WORKFLOW_NAME}', run id: {response['RunId']}")
                  return {"statusCode": 200, "body": f"Started workflow run {response['RunId']}"}

              record = records[0]
              bucket = record["s3"]["bucket"]["name"]
              key = record["s3"]["object"]["key"]
              print(f"Triggered by upload: s3://{bucket}/{key}")

              response = glue.start_workflow_run(
                  Name=WORKFLOW_NAME,
                  RunProperties={"source_bucket": bucket, "source_key": key},
              )
              run_id = response["RunId"]
              print(f"Started workflow '{WORKFLOW_NAME}', run id: {run_id}, source_key: {key}")

              return {
                  "statusCode": 200,
                  "body": f"Started workflow run {run_id} for s3://{bucket}/{key}"
              }

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${InputBucketName}"
      SourceAccount: !Ref AWS::AccountId

Outputs:
  InputBucketName:
    Value: !Ref InputBucket
  OutputBucketName:
    Value: !Ref OutputBucket
  ScriptsBucketName:
    Value: !Ref ScriptsBucket
  LambdaFunctionArn:
    Value: !GetAtt TriggerLambda.Arn
  WorkflowName:
    Value: !Ref PipelineWorkflow
