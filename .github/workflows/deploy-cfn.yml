name: Deploy Pipeline (CloudFormation)

on:
  workflow_dispatch:   # manual trigger only

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/pipeline.yaml \
            --stack-name adej-pipeline-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Upload Glue job script and sample input
        run: |
          aws s3 cp glue_job.py s3://adej-pipeline-scripts/scripts/glue_job.py
          aws s3 cp sample-input/products.csv s3://adej-pipeline-input/input/products.csv
